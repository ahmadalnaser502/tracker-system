server {
    listen 80;

    # طلبات الـ API — تُمرَّر (proxy) لحاوية الـ backend
    # اسم "backend" هون هو اسم الـ container، قابل للحل (resolve)
    # فقط لأن الاثنين رح يكونوا على نفس Docker network لاحقًا
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # كل شي ثاني — ملفات ستاتيكية (HTML/CSS/JS) من مجلد frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}