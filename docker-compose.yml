services:
  backend:
    build: ./backend
    container_name: backend
    environment:
      - TRACKER_DATA_DIR=/app/data
      - PORT=8080
    volumes:
      - D:\tracker-system\Tracker:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Prometheus — يجمع (scrape) المقاييس من backend:8080/metrics كل
  # 15 ثانية (راجع prometheus.yml) ويخزّنها كسلاسل زمنية. لا يحتاج
  # Dockerfile خاص — صورة رسمية جاهزة من Docker Hub.
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      # نمرّر ملف الإعداد كـ read-only bind mount. القراءة فقط (:ro)
      # مقصودة: Prometheus لا يحتاج ولا يجب أن يعدّل هذا الملف أبدًا.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # منفذ 9090 هو واجهة Prometheus نفسها (استعلامات PromQL يدوية،
      # فحص حالة الـ targets). نفتحه للخارج مؤقتًا للمراقبة اليدوية
      # أثناء التعلّم؛ لاحقًا مع Grafana قد لا تحتاج فتحه للجمهور.
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped